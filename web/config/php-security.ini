; easymakebot website — PHP runtime hardening + sane limits for WordPress.
; Mounted at /usr/local/etc/php/conf.d/zz-easymakebot.ini (loaded last).

; --- Disable process-spawning functions (the classic set managed WP hosts
;     block; WordPress + WooCommerce + mainstream plugins tolerate this).
;     NOT applied to the wp-cli container, which needs proc_open. ---
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,pcntl_fork

; --- Hide PHP from responses / errors -------------------------------------
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; --- Uploads / limits (course files, media) -----------------------------
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 120
max_input_time = 120
memory_limit = 256M
max_input_vars = 3000

; --- Sessions / cookies ------------------------------------------------
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1
session.cookie_samesite = "Lax"

; --- Misc ------------------------------------------------------------
allow_url_fopen = On
allow_url_include = Off
default_charset = "UTF-8"
date.timezone = "Asia/Tehran"

; --- OPcache (perf; revalidate so deploys take effect) ----------------
opcache.enable = 1
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 30
