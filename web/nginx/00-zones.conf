# http{}-context directives (conf.d/*.conf is included inside http{}).
# Loaded before default.conf because of the 00- prefix.

# Don't advertise the nginx version.
server_tokens off;

# Brute-force protection for wp-login.php — 6 requests/minute/IP, small burst.
limit_req_zone $binary_remote_addr zone=login:10m rate=6r/m;

# Behind Cloudflare / another proxy, the real client IP arrives in a header.
# For production, replace this with the real-ip module + Cloudflare ranges
# (see docs/10-deploy-runbook.md). On local dev it's a harmless no-op.
map $http_x_forwarded_proto $fcgi_https {
    default   "";
    https     "on";
}
