# easymakebot website — nginx (fronts php-fpm in the `wordpress` container).
# Local dev listens on :80 in the container -> published as :8080 on the host.
# Production TLS is terminated at Cloudflare and/or by nginx (see prod.conf.template).

upstream php {
    server wordpress:9000;
}

server {
    listen 80 default_server;
    server_name _;

    root /var/www/html;
    index index.php;

    client_max_body_size 64m;

    # nginx owns the security headers here; strip any duplicates coming back
    # from PHP so each appears exactly once. (On a host where we don't control
    # nginx, the harden.php mu-plugin sends them instead.)
    fastcgi_hide_header X-Content-Type-Options;
    fastcgi_hide_header X-Frame-Options;
    fastcgi_hide_header Referrer-Policy;
    fastcgi_hide_header Permissions-Policy;
    fastcgi_hide_header Cross-Origin-Opener-Policy;
    fastcgi_hide_header X-Powered-By;

    # --- Security headers (defence in depth; harden.php sends these too) -------
    add_header X-Content-Type-Options     "nosniff" always;
    add_header X-Frame-Options            "SAMEORIGIN" always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy         "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # --- Never expose these ---------------------------------------------------
    location ~ /\.                 { deny all; }            # .env .git .htaccess ...
    location = /wp-config.php       { deny all; }
    location ~* /(?:readme|license|changelog|wp-config-sample)\.(?:txt|html|md)$ { deny all; }
    location ~* \.(?:sql|bak|old|orig|save|swp|log)$ { deny all; }

    # No PHP execution anywhere under uploads (blocks uploaded web shells).
    location ~* ^/wp-content/uploads/.*\.(?:php[0-9]?|phtml|pht|pl|py|cgi|sh|lua|asp|jsp)$ {
        deny all;
    }

    # xmlrpc.php: brute-force / pingback-amplification vector, unused here.
    location = /xmlrpc.php { return 405; }

    # Rate-limit the login endpoint (zone defined in nginx.conf http{} — see
    # prod.conf.template; on local dev the zone may be absent, so guard with map).
    location = /wp-login.php {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/fastcgi_params_wp;
        fastcgi_pass php;
    }

    # --- Dynamic SEO files (WordPress / The SEO Framework) ------------------
    # Must come before the static-asset regex below, or nginx serves a 404
    # for these virtual files instead of handing them to PHP.
    location = /robots.txt {
        try_files $uri /index.php?$args;
        access_log off;
    }
    location ~* ^/(?:wp-sitemap|sitemap)[^/]*\.xml$ {
        try_files $uri /index.php?$args;
        access_log off;
    }
    location ~* ^/(?:wp-sitemap|sitemap)[^/]*\.xsl$ {
        try_files $uri /index.php?$args;
        access_log off;
    }

    # --- Static assets: nginx serves directly, long cache --------------------
    location ~* \.(?:css|js|mjs|json|map|svg|ico|gif|jpe?g|png|webp|avif|woff2?|ttf|otf|eot|mp4|webm|pdf|txt|xml)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    # --- WordPress front controller ----------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include /etc/nginx/fastcgi_params_wp;
        fastcgi_pass php;
        fastcgi_read_timeout 120s;
    }

    fastcgi_keep_conn on;
}
